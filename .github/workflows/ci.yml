name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token. This workflow has no secrets and uses `pull_request` (not
# `pull_request_target`), so it is safe to run on pull requests from forks.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Refuse to run if the committed Gradle wrapper jar has been tampered with.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :torph-core:test
      - name: Build libraries, demo and benchmark
        run: ./gradlew :torph-compose:assembleRelease :demo:assembleDebug :benchmark:assembleBenchmark
      # Publishing to a repository under build/ also validates the POMs, and keeps the
      # source-build path people are told to use in the README working.
      - name: Validate publishing
        run: ./gradlew publishLocalRepo
