name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :torph-core:test
      - name: Build library and demo
        run: ./gradlew :torph-compose:assembleRelease :demo:assembleDebug
      - name: Publish to local repo (dry run)
        run: ./gradlew publishToMavenLocal
